name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-Production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout src
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts
        env:
          NEXT_PUBLIC_ENABLE_HOME: ${{ vars.NEXT_PUBLIC_ENABLE_HOME }}
          NEXT_PUBLIC_ENABLE_ABOUT: ${{ vars.NEXT_PUBLIC_ENABLE_ABOUT }}
          NEXT_PUBLIC_ENABLE_EXPERIENCE: ${{ vars.NEXT_PUBLIC_ENABLE_EXPERIENCE }}
          NEXT_PUBLIC_ENABLE_TESTING_STRATEGY: ${{ vars.NEXT_PUBLIC_ENABLE_TESTING_STRATEGY }}
          NEXT_PUBLIC_ENABLE_PROJECTS: ${{ vars.NEXT_PUBLIC_ENABLE_PROJECTS }}
          NEXT_PUBLIC_ENABLE_SKILLS: ${{ vars.NEXT_PUBLIC_ENABLE_SKILLS }}
          NEXT_PUBLIC_ENABLE_CASE_STUDIES: ${{ vars.NEXT_PUBLIC_ENABLE_CASE_STUDIES }}
          NEXT_PUBLIC_ENABLE_BLOG: ${{ vars.NEXT_PUBLIC_ENABLE_BLOG }}
          NEXT_PUBLIC_ENABLE_TEST_ARTIFACTS: ${{ vars.NEXT_PUBLIC_ENABLE_TEST_ARTIFACTS }}
          NEXT_PUBLIC_ENABLE_CONTACT: ${{ vars.NEXT_PUBLIC_ENABLE_CONTACT }}
          API_BASEURL: ${{ vars.API_BASEURL }}
          API_KEY: ${{ secrets.API_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Deploy Project Artifacts to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  Deploy-Preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout src
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts
        env:
          NEXT_PUBLIC_ENABLE_HOME: ${{ vars.NEXT_PUBLIC_ENABLE_HOME }}
          NEXT_PUBLIC_ENABLE_ABOUT: ${{ vars.NEXT_PUBLIC_ENABLE_ABOUT }}
          NEXT_PUBLIC_ENABLE_EXPERIENCE: ${{ vars.NEXT_PUBLIC_ENABLE_EXPERIENCE }}
          NEXT_PUBLIC_ENABLE_TESTING_STRATEGY: ${{ vars.NEXT_PUBLIC_ENABLE_TESTING_STRATEGY }}
          NEXT_PUBLIC_ENABLE_PROJECTS: ${{ vars.NEXT_PUBLIC_ENABLE_PROJECTS }}
          NEXT_PUBLIC_ENABLE_SKILLS: ${{ vars.NEXT_PUBLIC_ENABLE_SKILLS }}
          NEXT_PUBLIC_ENABLE_CASE_STUDIES: ${{ vars.NEXT_PUBLIC_ENABLE_CASE_STUDIES }}
          NEXT_PUBLIC_ENABLE_BLOG: ${{ vars.NEXT_PUBLIC_ENABLE_BLOG }}
          NEXT_PUBLIC_ENABLE_TEST_ARTIFACTS: ${{ vars.NEXT_PUBLIC_ENABLE_TEST_ARTIFACTS }}
          NEXT_PUBLIC_ENABLE_CONTACT: ${{ vars.NEXT_PUBLIC_ENABLE_CONTACT }}
          API_BASEURL: ${{ vars.API_BASEURL }}
          API_KEY: ${{ secrets.API_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Deploy Project Artifacts to Vercel
        run: npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
